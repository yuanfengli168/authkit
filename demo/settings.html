<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings — AuthKit Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F9FAFB;
      color: #111827;
      margin: 0;
      padding: 0;
    }
    .page-header {
      background: #fff;
      border-bottom: 1px solid #E5E7EB;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .page-header a {
      color: #4F46E5;
      text-decoration: none;
      font-size: 14px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    #settings-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="index.html">← Back</a>
    <h1>Account Settings</h1>
  </div>

  <div id="settings-container"></div>

  <script type="module">
    import AuthKit from '../index.js';

    // Replace firebaseConfig with your own project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    await AuthKit.init({
      firebase: firebaseConfig,
      enabledProviders: ['google', 'email'],
      anchor: '#settings-container', // won't render login here — settings page
      loginMode: 'modal',
      theme: 'auto',
      brandName: 'My App',
      baseUrl: '../',
      afterLogout: 'index.html',
      settings: {
        enableSavedKeys: true,
        keysCollection: 'savedKeys',
      },
    });

    // Render the settings panel
    AuthKit.renderSettings('#settings-container');
  </script>
</body>
</html>
