<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings — AuthKit Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F9FAFB;
      color: #111827;
      margin: 0;
      padding: 0;
    }
    .page-header {
      background: #fff;
      border-bottom: 1px solid #E5E7EB;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .page-header a {
      color: #4F46E5;
      text-decoration: none;
      font-size: 14px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    #settings-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="index.html">← Back</a>
    <h1>Account Settings</h1>
  </div>

  <!-- Hidden anchor for AuthKit modal init (keeps #settings-container clean) -->
  <div id="ak-anchor" style="display:none"></div>
  <div id="settings-container"></div>

  <script type="module">
    import AuthKit from '../index.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAftuF-eDxWOdIBrHvFE50Qt8X7F9XvLFQ',
      authDomain: 'ai-idea-generator-d9e15.firebaseapp.com',
      projectId: 'ai-idea-generator-d9e15',
      storageBucket: 'ai-idea-generator-d9e15.firebasestorage.app',
      messagingSenderId: '997919258193',
      appId: '1:997919258193:web:8c1ad1f323a82b683faa70'
    };

    // Init with a separate hidden anchor so the modal doesn't clobber #settings-container
    await AuthKit.init({
      firebase: firebaseConfig,
      enabledProviders: ['google', 'email'],
      anchor: '#ak-anchor',
      loginMode: 'modal',
      theme: 'auto',
      brandName: 'AuthKit Demo',
      baseUrl: '../',
      redirects: {
        loginPage: 'index.html',
        afterLogout: 'index.html',
        afterLogin: null,
      },
      settings: {
        enableSavedKeys: true,
        keysCollection: 'savedKeys',
      },
    });

    // renderSettings awaits auth state internally before rendering
    await AuthKit.renderSettings('#settings-container');
  </script>
</body>
</html>
